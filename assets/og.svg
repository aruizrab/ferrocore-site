<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#9fb0bb" stroke-opacity=".06" stroke-width="1"/>
    </pattern>
    <radialGradient id="glowR" cx="0.88" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#e26230" stop-opacity=".34"/>
      <stop offset="1" stop-color="#e26230" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowP" cx="0.05" cy="1" r="0.5">
      <stop offset="0" stop-color="#46b4a0" stop-opacity=".2"/>
      <stop offset="1" stop-color="#46b4a0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9622f"/>
      <stop offset="0.55" stop-color="#a3381a"/>
      <stop offset="1" stop-color="#5e2210"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#0d1012"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glowR)"/>
  <rect width="1200" height="630" fill="url(#glowP)"/>

  <!-- decorative core sketch -->
  <g font-family="Ubuntu Sans Mono, DejaVu Sans Mono, monospace" font-weight="700" font-size="17" text-anchor="middle">
    <line x1="760" y1="168" x2="1150" y2="168" stroke="#d9c27a" stroke-opacity=".6" stroke-width="3"/>
    <g stroke="#d9c27a" stroke-opacity=".5" stroke-width="2">
      <line x1="800" y1="128" x2="800" y2="168"/><line x1="900" y1="128" x2="900" y2="168"/>
      <line x1="1000" y1="128" x2="1000" y2="168"/><line x1="1100" y1="128" x2="1100" y2="168"/>
      <line x1="850" y1="168" x2="850" y2="212"/><line x1="1050" y1="168" x2="1050" y2="212"/>
    </g>
    <g fill="#1b2328" stroke="#56656e" stroke-width="1.5">
      <rect x="765" y="96" width="70" height="32" rx="7"/><rect x="865" y="96" width="70" height="32" rx="7"/>
      <rect x="965" y="96" width="70" height="32" rx="7"/><rect x="1065" y="96" width="70" height="32" rx="7"/>
    </g>
    <g fill="#1b2328" stroke="#ec6f42" stroke-width="2">
      <rect x="815" y="212" width="70" height="32" rx="7"/><rect x="1015" y="212" width="70" height="32" rx="7"/>
      <rect x="1055" y="312" width="70" height="32" rx="7"/>
    </g>
    <g fill="#ece5dc">
      <text x="800" y="118">NRF</text><text x="900" y="118">AUSF</text><text x="1000" y="118">UDM</text><text x="1100" y="118">PCF</text>
      <text x="850" y="234">AMF</text><text x="1050" y="234">SMF</text><text x="1090" y="334">UPF</text>
    </g>
    <line x1="1050" y1="244" x2="1080" y2="312" stroke="#b392f0" stroke-opacity=".7" stroke-width="2"/>
    <g stroke="#ef6a3c" stroke-opacity=".5" stroke-width="2">
      <line x1="820" y1="430" x2="840" y2="244"/><line x1="960" y1="430" x2="855" y2="244"/>
    </g>
    <g stroke="#5cc4ae" stroke-opacity=".5" stroke-width="2">
      <line x1="820" y1="430" x2="1070" y2="344"/><line x1="960" y1="430" x2="1085" y2="344"/>
    </g>
    <g fill="#ec6f42" fill-opacity=".07" stroke="#ec6f42" stroke-opacity=".3" stroke-dasharray="4 6">
      <ellipse cx="820" cy="480" rx="100" ry="58"/><ellipse cx="960" cy="480" rx="100" ry="58"/><ellipse cx="1100" cy="480" rx="100" ry="58"/>
    </g>
    <g stroke="#ece5dc" stroke-width="2.5" stroke-linecap="round" fill="none">
      <path d="M810 446 820 414 830 446M814 432h12"/><path d="M950 446 960 414 970 446M954 432h12"/><path d="M1090 446 1100 414 1110 446M1094 432h12"/>
    </g>
    <g fill="#5cc4ae" stroke="#ece5dc" stroke-width="1.5">
      <rect x="776" y="488" width="10" height="16" rx="3"/><rect x="900" y="470" width="10" height="16" rx="3"/>
      <rect x="1010" y="500" width="10" height="16" rx="3"/><rect x="1130" y="478" width="10" height="16" rx="3"/>
    </g>
    <circle cx="1005" cy="495" r="22" fill="none" stroke="#ec6f42" stroke-width="2" stroke-opacity=".7"/>
    <g>
      <circle cx="838" cy="262" r="10" fill="#f2b24f" fill-opacity=".25"/><circle cx="838" cy="262" r="5" fill="#f2b24f"/>
      <circle cx="950" cy="168" r="10" fill="#d9c27a" fill-opacity=".25"/><circle cx="950" cy="168" r="5" fill="#d9c27a"/>
      <circle cx="1066" cy="280" r="10" fill="#b392f0" fill-opacity=".25"/><circle cx="1066" cy="280" r="5" fill="#b392f0"/>
      <circle cx="1000" cy="380" r="8" fill="#5cc4ae" fill-opacity=".25"/><circle cx="1000" cy="380" r="4" fill="#5cc4ae"/>
    </g>
  </g>

  <!-- brand -->
  <g transform="translate(72 82)">
    <rect width="104" height="104" rx="22" fill="url(#tile)"/>
    <rect x="2" y="2" width="100" height="100" rx="20" fill="none" stroke="#ffd9bf" stroke-opacity=".35" stroke-width="2"/>
    <text x="14" y="28" font-family="Ubuntu Sans Mono, DejaVu Sans Mono, monospace" font-weight="700" font-size="17" fill="#ffe7d6">26</text>
    <text x="52" y="80" text-anchor="middle" font-family="Ubuntu Sans, DejaVu Sans, sans-serif" font-weight="700" font-size="52" fill="#fff6ee" letter-spacing="-1">Fe</text>
    <text x="134" y="70" font-family="Ubuntu Sans Mono, DejaVu Sans Mono, monospace" font-weight="700" font-size="60" fill="#ece5dc" letter-spacing="-2">ferrocore</text>
  </g>
  <g font-family="Ubuntu Sans, DejaVu Sans, sans-serif" fill="#ece5dc">
    <text x="72" y="300" font-size="56" font-weight="800" letter-spacing="-1.5">A 5G Core in Rust.</text>
    <text x="72" y="368" font-size="56" font-weight="800" letter-spacing="-1.5">Every run is a <tspan fill="#ec6f42">dataset</tspan>.</text>
    <text x="72" y="430" font-size="25" fill="#a59d93">5G core network functions on a 3GPP Rel-17 baseline,</text>
    <text x="72" y="464" font-size="25" fill="#a59d93">later releases as runtime profiles, a simulated RAN,</text>
    <text x="72" y="498" font-size="25" fill="#a59d93">labelled datasets and MCP control for LLM agents.</text>
  </g>
  <text x="72" y="572" font-family="Ubuntu Sans Mono, DejaVu Sans Mono, monospace" font-size="20" font-weight="700" fill="#62c0ad">aruizrab.github.io/ferrocore-site</text>
  <rect x="0" y="622" width="1200" height="8" fill="#a3381a"/>
</svg>
